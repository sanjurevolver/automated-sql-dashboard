name: Pipeline validation
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: analytics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://analytics:ci-only-password@localhost:5432/analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Create isolated full-dataset database
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True) as con:
              con.execute('CREATE DATABASE analytics_full')
          PY
      - name: Run full PostgreSQL pipeline and verify retry safety
        env:
          DATABASE_URL: postgresql://analytics:ci-only-password@localhost:5432/analytics_full
        run: |
          python - <<'PY'
          from decimal import Decimal
          from pipeline import run, warehouse
          first=run(backend='postgres')
          assert first['new_rows']==1056320, first
          second=run(backend='postgres')
          assert second['status']=='skipped' and second['new_rows']==0, second
          with warehouse('postgres') as con:
              count, volume, net=con.execute('SELECT COUNT(*),SUM(amount),SUM(signed_amount) FROM fact_transaction').fetchone()
              assert count==1056320
              assert volume==Decimal('6257793560.30')
              assert net==Decimal('197151288.70')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-validation
          path: |
            reports/latest.json
            reports/*/run.json
            reports/*/quality.json
            reports/*/statistics.json
            reports/*/kpis.json
            reports/*/insights.md
