name: Pipeline validation
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: analytics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://analytics:ci-only-password@localhost:5432/analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: Create isolated full-dataset database
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True) as con:
              con.execute('CREATE DATABASE analytics_full')
          PY
      - name: Run full PostgreSQL pipeline and verify retry safety
        env:
          DATABASE_URL: postgresql://analytics:ci-only-password@localhost:5432/analytics_full
        run: |
          python - <<'PY'
          from pipeline import run, warehouse
          first = run(backend='postgres', max_reject_rate=0.01)
          assert first['new_rows'] > 0, first
          assert first['screening']['status'] == 'loaded', first
          assert first['screening']['new_rows'] > 0, first
          print('BULK_COPY_METRICS', first['screening'])
          second = run(backend='postgres', max_reject_rate=0.01)
          assert second['status'] == 'skipped' and second['new_rows'] == 0, second
          assert second['screening']['status'] == 'skipped', second
          assert second['screening']['new_rows'] == 0, second
          with warehouse('postgres') as con:
              sat_count = con.execute('SELECT COUNT(*) FROM dim_satellite').fetchone()[0]
              fact_count = con.execute('SELECT COUNT(*) FROM fact_orbital_position').fetchone()[0]
              epoch_count = con.execute('SELECT COUNT(*) FROM dim_time_epoch').fetchone()[0]
              assert sat_count > 0
              assert fact_count == sat_count
              assert epoch_count > 0
              conjunction_count = con.execute('SELECT COUNT(*) FROM fact_conjunction').fetchone()[0]
              assert conjunction_count == first['screening']['new_rows'] > 0
              assert con.execute('SELECT COUNT(*) FROM screening_batch').fetchone()[0] == 1
              assert con.execute('''SELECT COUNT(*) FROM (
                  SELECT snapshot_sk,object_a_sk,object_b_sk FROM fact_conjunction
                  GROUP BY 1,2,3 HAVING COUNT(*) > 1) duplicates''').fetchone()[0] == 0
              print(f"Verified {sat_count:,} satellites and {fact_count:,} orbital state vectors loaded into fact_orbital_position")
          PY
      - name: Preserve raw GP snapshot and provenance
        uses: actions/upload-artifact@v4
        with:
          name: raw-gp-data
          path: |
            data/raw/gp/
            data/raw/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: analytics-validation
          path: |
            reports/latest.json
            reports/*/run.json
            reports/*/quality.json
            reports/*/statistics.json
            reports/*/kpis.json
            reports/*/insights.md
            reports/*/quarantine.csv
            reports/*/screening.json
            reports/*/conjunctions_per_snapshot.csv
            reports/*/risk_tier_distribution.csv
